{% extends 'base.html' %}

{% block title %}Delete Tutorial Topic — CodeWithAmit{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 550px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 text-center bg-surface">
        <div class="mb-3 text-danger">
            <i class="bi bi-trash3-fill fs-1"></i>
        </div>
        <h3 class="fw-bold mb-2">Delete Tutorial Topic?</h3>
        <p class="text-secondary small mb-4">
            Are you sure you want to delete <strong>"{{ topic.title }}"</strong> from <strong>{{ category.name }}</strong>?
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'tutorials:tutorial_detail' category.slug topic.slug %}" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                <button type="submit" class="btn btn-danger px-4 rounded-pill fw-semibold">
                    <i class="bi bi-trash me-1"></i> Yes, Delete
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
