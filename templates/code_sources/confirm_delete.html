{% extends 'base.html' %}

{% block title %}Delete Code Source — CodeWithAmit{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 rounded-4 shadow-sm text-center" style="background: var(--cwa-bg-card); border: 1px solid var(--cwa-border);">
                <div class="rounded-circle d-inline-flex p-3 mb-3 mx-auto" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                    <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                </div>
                <h4 class="fw-bold font-heading mb-2" style="color: var(--cwa-text-heading);">Delete Code Source?</h4>
                <p class="text-secondary small mb-4">
                    Are you sure you want to permanently delete <strong>"{{ code_source.title }}"</strong>? This action cannot be undone.
                </p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'code_sources:detail' code_source.slug %}" class="btn btn-outline-secondary rounded-pill px-4 py-2 small">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger rounded-pill px-4 py-2 small fw-semibold">
                            <i class="bi bi-trash me-1"></i> Yes, Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
